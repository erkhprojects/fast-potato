version: "3.9"

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: fastpotato
      POSTGRES_PASSWORD: fastpotato
      POSTGRES_DB: fastpotato
    command: ["postgres", "-c", "wal_level=logical", "-c", "max_replication_slots=8", "-c", "max_wal_senders=8"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fastpotato"]
      interval: 3s
      timeout: 5s
      retries: 15

  mongo:
    image: mongo:7
    command: ["--replSet", "rs0", "--bind_ip_all"]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 3s
      timeout: 5s
      retries: 15

  mongo-init:
    image: mongo:7
    depends_on:
      mongo:
        condition: service_healthy
    restart: "no"
    entrypoint: >
      mongosh --host mongo --eval
      "try { rs.status() } catch(e) { rs.initiate({_id:'rs0', members:[{_id:0, host:'mongo:27017'}]}) }"

  test:
    build:
      context: .
      dockerfile: Dockerfile.test
    depends_on:
      postgres:
        condition: service_healthy
      mongo-init:
        condition: service_completed_successfully
    environment:
      POSTGRES_DSN: postgresql://fastpotato:fastpotato@postgres:5432/fastpotato
      MONGO_URI: mongodb://mongo:27017/?replicaSet=rs0
    command: ["pytest", "cdc/tests/", "-m", "integration", "-v", "-s", "--tb=short"]
