[project]
name = "fast-potato"
version = "0.1.0"
description = "Async-first distributed task queue"
authors = [
    {name = "Ehsan Rakhshankhah",email = "ehsan.rakhshankhah@dkfz-heidelberg.de"}
]
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.14,<4.0"
dependencies = [
    "pydantic>=2.0",
    "croniter>=2.0",
]

[project.optional-dependencies]
redis = ["redis>=5.0"]
rabbitmq = ["aio-pika>=9.0"]
all = ["redis>=5.0", "aio-pika>=9.0"]

[project.scripts]
fast-potato = "fast_potato.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.4.0",
    "mypy>=1.15.0",
    "ruff>=0.9.0",
    "poethepoet>=0.33.0",
]
docs = [
    "mkdocs>=1.6,<2",
    "mkdocs-material>=9.7.7",
    "mkdocs-static-i18n>=1.3.1",
]

[tool.poe.tasks]
test = "pytest tests/test_*.py"
test-integration = "docker compose -p fast_potato -f tests/integration/docker-compose.test.yml up --build --exit-code-from test --abort-on-container-exit"
test-integration-local = "pytest tests/integration"
services-up = "docker compose -p fast_potato -f tests/integration/docker-compose.yml up -d --build"
services-down = "docker compose -p fast_potato -f tests/integration/docker-compose.yml down"
lint = "ruff check ."
format = "ruff format ."
typecheck = "mypy"

[tool.ruff]
target-version = "py314"
line-length = 88

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "TID", # flake8-tidy-imports (banned-api)
]
ignore = [
    "E501",  # line length handled by formatter
    "B008",  # do not perform function calls in argument defaults (standard for Depends())
]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"typing.TYPE_CHECKING".msg = "Don't hide import cycles behind TYPE_CHECKING. Structure dependencies to point one way."

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.14"
# Checked by a bare `mypy` / `poe typecheck`. Examples are documentation, so
# they must type-check too; tests/typecheck is the send() typing contract.
files = ["fast_potato", "examples", "tests/typecheck"]
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
ignore_missing_imports = true
disable_error_code = ["import-untyped"]
