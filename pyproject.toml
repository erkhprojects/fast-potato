[project]
name = "fast-potato"
version = "0.1.0"
description = "Async-first distributed task queue"
authors = [
    {name = "Ehsan Rakhshankhah",email = "ehsan.rakhshankhah@dkfz-heidelberg.de"}
]
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.14,<4.0"
dependencies = [
    "pydantic>=2.0",
    "croniter>=2.0",
]

[project.optional-dependencies]
redis = ["redis>=5.0"]
rabbitmq = ["aio-pika>=9.0"]
all = ["redis>=5.0", "aio-pika>=9.0"]

[project.scripts]
fast-potato = "fast_potato.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.4.0",
    "mypy>=1.15.0",
    "ruff>=0.9.0",
]

[tool.ruff]
target-version = "py314"
line-length = 88

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "TID", # flake8-tidy-imports (banned-api)
]
ignore = [
    "E501",  # line length handled by formatter
    "B008",  # do not perform function calls in argument defaults (standard for Depends())
]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.14"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
ignore_missing_imports = true
disable_error_code = ["import-untyped"]
