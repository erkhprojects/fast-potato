[project]
name = "fast-potato"
version = "0.1.0"
description = "Async-first distributed task queue"
authors = [
    {name = "Ehsan Rakhshankhah",email = "ehsan.rakhshankhah@dkfz-heidelberg.de"}
]
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "pydantic>=2.0",
]

[project.optional-dependencies]
redis = ["redis>=5.0"]
rabbitmq = ["aio-pika>=9.0"]
all = ["redis>=5.0", "aio-pika>=9.0"]

[tool.poetry]
packages = [
    {include = "core"},
    {include = "ingestor"},
    {include = "digester"},
    {include = "brokers"},
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests", "core/tests", "ingestor/tests", "digester/tests", "brokers/tests"]

[dependency-groups]
dev = [
    "pytest (>=9.0.3,<10.0.0)",
    "pytest-asyncio (>=1.4.0,<2.0.0)"
]
