version: "3.9"

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: fastpotato
      POSTGRES_PASSWORD: fastpotato
      POSTGRES_DB: fastpotato
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fastpotato"]
      interval: 3s
      timeout: 5s
      retries: 15
