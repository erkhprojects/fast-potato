    <line x1="4" y1="25" x2="14" y2="25"/>
    <line x1="3" y1="33" x2="11" y2="33"/>
    <line x1="5" y1="41" x2="13" y2="41"/>
  </g>
  <g transform="rotate(-14 39 33)">
