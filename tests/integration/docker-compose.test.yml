name: fast_potato

include:
  - docker-compose.yml

services:
  test:
    build:
      context: ../..
      dockerfile: tests/integration/Dockerfile
      target: test
    depends_on:
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      worker-redis:
        condition: service_started
      worker-rabbitmq:
        condition: service_started
    environment:
      REDIS_URL: "redis://redis:6379/0"
      RABBITMQ_URL: "amqp://guest:guest@rabbitmq:5672/"
      SHARED_DIR: "/shared"
    volumes:
      - ./testdir4data_dump:/shared
    command: ["pytest", "tests/integration", "-v", "-s", "--tb=short"]
