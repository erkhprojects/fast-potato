name: fast_potato

services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 10

  rabbitmq:
    image: rabbitmq:3-management-alpine
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      # "ping" only proves the Erlang node is up; this waits for the AMQP listener
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_port_connectivity"]
      interval: 5s
      timeout: 5s
      retries: 10

  worker-redis:
    build:
      context: ../..
      dockerfile: tests/integration/Dockerfile
      target: test
    depends_on:
      redis:
        condition: service_healthy
    environment:
      REDIS_URL: "redis://redis:6379/0"
      SHARED_DIR: "/shared"
    volumes:
      - ./testdir4data_dump:/shared
    command: ["fast-potato", "-A", "tests.integration.demo_app:app_redis", "-q", "deploy_redis", "-w", "1", "-c", "2"]

  worker-rabbitmq:
    build:
      context: ../..
      dockerfile: tests/integration/Dockerfile
      target: test
    depends_on:
      rabbitmq:
        condition: service_healthy
    environment:
      RABBITMQ_URL: "amqp://guest:guest@rabbitmq:5672/"
      SHARED_DIR: "/shared"
    volumes:
      - ./testdir4data_dump:/shared
    command: ["fast-potato", "-A", "tests.integration.demo_app:app_rmq", "-q", "deploy_rmq", "-w", "1", "-c", "2"]
