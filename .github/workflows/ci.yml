name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call: # lets publish.yml run these same checks before releasing

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.14"
          enable-cache: true
      - run: uv sync --frozen --group dev --group docs
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run pytest tests/test_*.py
      # Same build Read the Docs runs; fails on broken links/nav before merge.
      - run: uv run mkdocs build --strict
